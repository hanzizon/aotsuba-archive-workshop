name: Copy archive assets

on:
  push:
    paths:
      - '.github/workflows/copy-assets.yml'

permissions:
  contents: write

jobs:
  copy-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy background images from revision workshop
        run: |
          curl -L --fail -o aotsuba-bg.png https://raw.githubusercontent.com/hanzizon/aotsuba-revision-workshop/main/aotsuba-bg.png
          curl -L --fail -o aotsuba-bg-2.png https://raw.githubusercontent.com/hanzizon/aotsuba-revision-workshop/main/aotsuba-bg-2.png
          curl -L --fail -o aotsuba-bg-3.png https://raw.githubusercontent.com/hanzizon/aotsuba-revision-workshop/main/aotsuba-bg-3.png
      - name: Commit assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add aotsuba-bg.png aotsuba-bg-2.png aotsuba-bg-3.png
          git diff --cached --quiet || git commit -m "Copy archive background assets"
          git push
