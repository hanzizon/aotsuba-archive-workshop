<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <title>아오츠바 아카이브</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles-main.css?v=20260908-title-home1">
  <link rel="stylesheet" href="./styles-editor.css?v=20260908-title-home1">
  <link rel="stylesheet" href="./styles-workshop-sync.css?v=20260908-series-meta1">
  <link rel="stylesheet" href="./styles-enhancements.css?v=20260908-series-meta1">
  <link rel="stylesheet" href="./styles-series-manager.css?v=20260908-title-home1">
  <link rel="stylesheet" href="./styles-admin.css?v=20260908-series-meta1">
  <link rel="stylesheet" href="./styles-archive-features.css?v=20260908-series-meta1">
  <style>
    .post-preview-actions{
      display:flex;
      justify-content:flex-end;
      margin:0 0 12px;
    }
    .post-edit-btn{
      border:1px solid var(--line);
      border-radius:10px;
      padding:8px 11px;
      background:#fff;
      color:var(--accent);
      font-size:13px;
      font-weight:700;
      cursor:pointer;
      transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
    }
    .post-edit-btn:hover{border-color:#c9cce0}
    .post-edit-btn.press-active{
      border-color:#D9D9F2;
      box-shadow:0 3px 8px rgba(25,30,50,.10),inset 0 1px 2px rgba(25,30,50,.06);
      transform:translateY(1px);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-block">
        <div class="brand archive-home-link" id="archiveEditorTrigger" role="button" tabindex="0" data-archive-home aria-label="아오츠바 아카이브 홈으로 이동">아오츠바 아카이브</div>
        <div class="subtitle">미야케 아오이X아오야기 츠바키</div>
      </div>

      <div class="header-actions">
        <button type="button" class="ghost-btn" id="seriesManageBtn">시리즈</button>
        <button type="button" class="primary-btn" id="writeBtn">새 포스트</button>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <section class="section-block">
      <div class="section-head">
        <div>
          <p class="section-kicker">SERIES</p>
          <h2>시리즈</h2>
        </div>
        <button type="button" class="text-btn" id="showAllSeriesBtn">전체 보기</button>
      </div>

      <div class="series-scroller" id="seriesGrid" aria-live="polite"></div>
    </section>

    <footer class="site-footer">
      <span>아오츠바 츠하자.</span>
    </footer>
  </main>

  <section class="post-editor" id="postEditor" aria-hidden="true">
    <div class="post-editor-shell">
      <div class="post-editor-top">
        <div class="post-editor-brand-block">
          <div class="post-editor-heading archive-home-link" role="button" tabindex="0" data-archive-home aria-label="아오츠바 아카이브 홈으로 이동">아오츠바 아카이브</div>
          <div class="post-editor-subtitle">포스트 작성실</div>
        </div>
        <div class="post-editor-actions">
          <span class="editor-save-state" id="editorSaveState">자동 저장</span>
          <div class="editor-action-group">
            <button type="button" class="ghost-btn" id="editorTempSaveBtn">임시저장</button>
            <button type="button" class="ghost-btn" id="editorTempLoadBtn">불러오기</button>
          </div>
          <div class="editor-action-group">
            <button type="button" class="ghost-btn" id="editorCloseBtn">닫기</button>
            <button type="button" class="primary-btn" id="editorPublishBtn">게시 준비</button>
          </div>
        </div>
      </div>

      <div class="post-editor-meta">
        <input id="editorTitle" class="editor-title-input" type="text" placeholder="제목을 입력하세요" aria-label="포스트 제목">
        <div class="editor-meta-row">
          <select id="editorSeries" aria-label="시리즈 선택">
            <option value="">시리즈 없음</option>
          </select>
          <input id="editorTags" type="text" placeholder="태그를 쉼표로 구분해서 입력" aria-label="태그">
        </div>
        <div class="editor-format-row">
          <span class="editor-format-label">본문</span>
          <select id="editorFontFamily" aria-label="본문 폰트">
            <option value="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif">기본 폰트</option>
            <option value="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">애플 고딕</option>
            <option value="Georgia,'Times New Roman','Noto Serif KR',serif">세리프</option>
            <option value="'Noto Serif KR',serif">본명조</option>
            <option value="'KoPubWorldDotum','Noto Sans KR',sans-serif">KoPub 돋움</option>
            <option value="'KoPubWorldBatang','Noto Serif KR',serif">KoPub 바탕</option>
          </select>
          <select id="editorFontSize" aria-label="본문 글자 크기">
            <option value="9">9pt</option>
            <option value="10">10pt</option>
            <option value="11">11pt</option>
            <option value="12">12pt</option>
            <option value="13">13pt</option>
            <option value="14">14pt</option>
          </select>
        </div>
      </div>

      <textarea id="editorBody" class="editor-body" placeholder="이야기를 시작하세요." aria-label="포스트 본문"></textarea>
    </div>
  </section>

  <div class="preview-modal" id="previewModal" hidden>
    <div class="preview-backdrop" data-close-preview></div>
    <article class="preview-sheet" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
      <div class="preview-top">
        <div class="preview-brand-block">
          <div class="preview-archive-brand archive-home-link" id="previewTitle" role="button" tabindex="0" data-archive-home aria-label="아오츠바 아카이브 홈으로 이동">아오츠바 아카이브</div>
          <span class="preview-kind" id="previewKind"></span>
        </div>
        <button type="button" class="preview-close" data-close-preview>닫기</button>
      </div>
      <div id="previewContent"></div>
    </article>
  </div>

  <img class="aotsuba-bg is-off" id="aotsubaBg" alt="" aria-hidden="true" decoding="async">
  <button type="button" class="bg-image-toggle" id="bgImageToggle" aria-pressed="false">이미지 OFF</button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./app-core.js?v=20260908-title-home1"></script>
  <script src="./app-editor.js?v=20260908-title-home1"></script>
  <script src="./app-admin.js?v=20260908-title-home1"></script>
  <script src="./app-formatting.js?v=20260908-series-meta1"></script>
  <script src="./app-editor-fix.js?v=20260908-title-home1"></script>
  <script>
    (()=>{
      const POST_EDIT_KEY="aotsubaArchive.postEdits.v1";
      let editingPostId=null;
      const originalOpenPostPreview=openPostPreview;
      const originalClosePostEditor=closePostEditor;

      function loadPostEdits(){
        try{
          const raw=localStorage.getItem(POST_EDIT_KEY);
          if(!raw) return;
          const edits=JSON.parse(raw);
          if(!edits || typeof edits!=="object") return;
          state.posts=state.posts.map(post=>edits[post.id] ? {...post,...edits[post.id]} : post);
          renderAll();
        }catch(err){
          console.error("수정 포스트 불러오기 실패",err);
        }
      }

      function savePostEdit(post){
        try{
          const raw=localStorage.getItem(POST_EDIT_KEY);
          const edits=raw ? JSON.parse(raw) : {};
          edits[post.id]={
            title:post.title,
            seriesId:post.seriesId,
            tags:post.tags,
            body:post.body,
            bodyHtml:post.bodyHtml||""
          };
          localStorage.setItem(POST_EDIT_KEY,JSON.stringify(edits));
        }catch(err){
          console.error("수정 포스트 저장 실패",err);
        }
      }

      function setEditorMode(post=null){
        editingPostId=post?.id || null;
        const heading=document.querySelector(".post-editor-subtitle");
        const submit=document.querySelector("#editorPublishBtn");
        if(heading) heading.textContent=editingPostId ? "포스트 수정실" : "포스트 작성실";
        if(submit) submit.textContent=editingPostId ? "수정 저장" : "게시!";
      }

      function openPostEditorForEdit(post){
        if(!post) return;
        populateEditorSeries();
        setEditorMode(post);

        document.querySelector("#editorTitle").value=cleanPostTitle(post.title||"");
        document.querySelector("#editorSeries").value=post.seriesId||"";
        document.querySelector("#editorTags").value=(post.tags||[]).join(", ");
        document.querySelector("#editorBody").value=post.body||"";
        document.querySelector("#editorFontSize").value=getDefaultEditorFontSize();
        applyEditorTypography();

        const editor=document.querySelector("#postEditor");
        window.__archiveRichSkipNextSync=true;
        editor.classList.add("open");
        editor.setAttribute("aria-hidden","false");
        document.body.style.overflow="hidden";
        setTimeout(()=>{
          if(window.setArchiveEditorHtml){
            window.setArchiveEditorHtml(post.bodyHtml || window.archivePlainTextToHtml?.(post.body||"") || "");
          }
          document.querySelector("#editorRichBody")?.focus();
        },20);
      }

      openPostPreview=function(post){
        const series=seriesById(post.seriesId);
        document.querySelector("#previewKind").textContent="";
        const renderedBody=window.renderArchivePostBody ? window.renderArchivePostBody(post) : escapeHtml(post.body||"");
        document.querySelector("#previewContent").innerHTML=`
          <div class="post-preview-actions"><button type="button" class="post-edit-btn">수정</button></div>
          <h2 class="preview-title">${episodeBadge(post)}<span class="preview-title-text">${escapeHtml(cleanPostTitle(post.title))}</span></h2>
          <div class="preview-meta">
            <span>${formatDate(post.date)}</span>
            ${series ? `<span class="post-series">${escapeHtml(series.title)}</span>` : ""}
          </div>
          <div class="preview-body">${renderedBody}</div>
        `;
        document.querySelector("#previewModal").hidden=false;
        document.body.style.overflow="hidden";
        document.querySelector(".post-edit-btn")?.addEventListener("click",e=>{
          pulsePress(e.currentTarget);
          closePreview();
          setTimeout(()=>openPostEditorForEdit(post),80);
        });
      };

      const submit=document.querySelector("#editorPublishBtn");
      submit?.addEventListener("click",e=>{
        if(!editingPostId) return;
        e.preventDefault();
        e.stopImmediatePropagation();

        const idx=state.posts.findIndex(p=>p.id===editingPostId);
        if(idx<0) return;

        const current=state.posts[idx];
        const updated={
          ...current,
          title:(document.querySelector("#editorTitle")?.value||"").trim(),
          seriesId:document.querySelector("#editorSeries")?.value||"",
          tags:(document.querySelector("#editorTags")?.value||"")
            .split(",")
            .map(v=>v.trim())
            .filter(Boolean),
          body:document.querySelector("#editorBody")?.value||"",
          bodyHtml:window.getArchiveEditorHtml?.()||""
        };

        state.posts[idx]=updated;
        savePostEdit(updated);
        renderAll();
        toast("포스트를 수정했습니다.");
        setEditorMode(null);
        originalClosePostEditor();
        setTimeout(()=>openPostPreview(updated),100);
      },true);

      document.querySelector("#editorCloseBtn")?.addEventListener("click",()=>setEditorMode(null),true);
      document.querySelector("#writeBtn")?.addEventListener("click",()=>setEditorMode(null),true);
      document.addEventListener("archive-home",()=>setEditorMode(null));

      loadPostEdits();
    })();
  </script>
  <script src="./app-series-manager.js?v=20260908-title-home1"></script>
  <script src="./app-publishing.js?v=20260908-title-home1"></script>
  <script src="./app-series-order.js?v=20260908-series-meta1"></script>
  <script src="./app-post-tools.js?v=20260908-series-meta1"></script>
</body>
</html>
